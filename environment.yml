# Packages imported by scripts/, pinned to the versions the current results were produced with.
#   conda env create -f environment.yml
name: age_pred
channels:
  - conda-forge
dependencies:
  - python=3.12              # helpers.py reuses the enclosing quotes inside an f-string (PEP 701)
  - numpy=2.3.5
  - pandas=2.3.3
  - scipy=1.16.3
  - scikit-learn=1.8.0
  - statsmodels=0.14.6
  - pingouin=0.6.1
  - matplotlib-base=3.10.8
  - seaborn-base=0.13.2
  - joblib=1.5.3
  - py-xgboost=3.4.1=cuda*   # the CUDA build trains on the CPU or the GPU, as --xgb_device choose
  - optuna=3.6.1
  - nibabel=5.3.2
  - nilearn=0.12.1
  - mne-base=1.12.1          # make_df_rs-eeg_psd.py: mne.io.read_raw_eeglab
  - dropbox=12.0.2           # fetch_dropbox_files.py
  - python-dotenv=1.2.2      # fetch_dropbox_files.py
